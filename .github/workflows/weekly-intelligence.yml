name: Update weekly intelligence

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh weekly intelligence
        run: node scripts/update-weekly-intelligence.mjs
      - name: Commit updated intelligence data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly-intelligence.json
          git diff --cached --quiet || git commit -m "chore: update weekly intelligence"
          git push
